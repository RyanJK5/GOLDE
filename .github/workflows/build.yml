name: Build & Test
on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-gcc
            arch: x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64-gcc
            arch: arm64
          - os: windows-latest
            name: windows-msvc
          - os: macos-latest
            name: macos-arm64-clang
            arch: arm64
          - os: macos-26-intel
            name: macos-x86_64-clang
            arch: x86_64
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++-14 libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev pkg-config libgtk-3-dev
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 100

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm ninja
        LLVM_PATH="$(brew --prefix llvm)"
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER="$LLVM_PATH/bin/clang" \
          -DCMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++" \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="13.3"
    
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          
    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: | 
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DGOLDE_ARCH=${{ matrix.arch }}

    - name: Setup MSVC Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1


    - name: Build
      run: cmake --build build --parallel --config Release

    - name: Test
      run: |
        ctest --test-dir build --build-config Release --output-on-failure --parallel

    - name: Save Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.name }}
        path: build/

  headless:
    name: Build (linux-headless)
    runs-on: ubuntu-latest
    # A bare GCC image has no OpenGL or X11 headers, so this proves the
    # algorithm layer builds without them (GOLDE_BUILD_GUI=OFF).
    container: gcc:14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y ninja-build
        curl -sSL https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz | tar -xz -C /opt
        echo "/opt/cmake-3.30.5-linux-x86_64/bin" >> "$GITHUB_PATH"

    - name: Check that no GL headers are installed
      run: |
        if [ -e /usr/include/GL/gl.h ]; then echo "GL headers present"; exit 1; fi

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGOLDE_BUILD_GUI=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Test
      run: ctest --test-dir build --output-on-failure --parallel
